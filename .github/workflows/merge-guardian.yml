name: merge-guardian

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-policy:
    if: github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/guardian-recheck '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: guardian-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Evaluate trusted base policy and publish exact-head status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/merge_guardian.py

  audit-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Audit merged PR provenance and reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/merge_guardian.py
